services:
  auth-service:
    build: ./auth-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=auth-db
      - DB_USER=authuser
      - DB_PASS=authpass
      - DB_NAME=authdb
      - JWT_SECRET=supersecretkey
    depends_on:
      auth-db:
        condition: service_healthy

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpass
      - POSTGRES_DB=authdb
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser"]
      interval: 2s
      timeout: 5s
      retries: 10

  products-service:
    build: ./products-service
    ports:
      - "3002:3001"
    environment:
      - DB_HOST=products-db
      - DB_USER=productsuser
      - DB_PASS=productspass
      - DB_NAME=productsdb
    depends_on:
      products-db:
        condition: service_healthy

  products-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=productsuser
      - POSTGRES_PASSWORD=productspass
      - POSTGRES_DB=productsdb
    volumes:
      - products_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productsuser"]
      interval: 2s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth-service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  auth_db_data:
  products_db_data:
