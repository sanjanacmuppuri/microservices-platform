services:
  auth-service:
    build: ./auth-service
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=auth-db
      - DB_USER=authuser
      - DB_PASS=authpass
      - DB_NAME=authdb
      - JWT_SECRET=supersecretkey
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=authuser
      - POSTGRES_PASSWORD=authpass
      - POSTGRES_DB=authdb
    volumes:
      - auth_db_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - auth-service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  auth_db_data:
     
